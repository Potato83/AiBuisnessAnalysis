<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alpha Analytics — staging bootstrap</title>
<style>
body{font:16px system-ui,sans-serif;max-width:680px;margin:10vh auto;padding:0 20px;background:#f7f8fb;color:#17202a}
main{padding:32px;background:#fff;border-radius:16px;box-shadow:0 2px 16px #0001}
code{background:#eef2f7;border-radius:4px;padding:3px 5px}#status{font-weight:650}
</style>
</head>
<body><main>
<h1>Alpha Business News Analytics</h1>
<p>Инфраструктурный smoke-test. Полноценный React-интерфейс добавляется отдельным PR.</p>
<p>Frontend → API → PostgreSQL: <span id="status">проверяем…</span></p>
<p><a href="/api/v1/companies">/api/v1/companies</a> · <a href="/api/v1/health">/api/v1/health</a></p>
</main>
<script>
fetch('/api/v1/health').then(async r => {if (!r.ok) throw new Error('HTTP '+r.status); return r.json()})
.then(data => {document.getElementById('status').textContent=data.status==='ok' && data.database==='ok' ? 'OK' : 'не готово'})
.catch(e => {document.getElementById('status').textContent='ошибка: '+e.message});
</script>
</body></html>
